spring.application.name=iw3

# Perfil por defecto al correr en la PC (Eclipse, IntelliJ o "mvnw spring-boot:run").
# En la VM el perfil mysqlprod llega desde Tomcat (catalina.properties) y pisa este valor.
spring.profiles.active=mysqldev

dev.info.enabled=true

spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Base de datos local (MySQL en el puerto 33306). Ver README.md -> "Entorno de desarrollo".
spring.datasource.url=jdbc:mysql://localhost:33306/iw3_2026?createDatabaseIfNotExist=true&verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=iw3
spring.datasource.password=iw3pass
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Niveles de log: ERROR, WARN, INFO, DEBUG, TRACE
logging.level.root=WARN
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.type=WARN
logging.level.com.zaxxer.hikari=INFO

logging.level.ar.edu.iua.iw3=DEBUG
logging.level.ar.edu.iua.iw3.auth.filters.JWTAuthorizationFilter=INFO

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false

# Mail (se usa para la alarma de temperatura del final).
# Usuario y clave NUNCA en el repo: se pasan por variables de entorno SMTP_USER y SMTP_PASS.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Configuración propia del trabajo integrador
# ---------------------------------------------------------------------------

# Cada cuántos segundos se guarda un registro de detalle de carga.
# Los datos pueden llegar más seguido: la cabecera de la orden siempre guarda el último valor,
# pero en la tabla de detalle solo se guarda uno cada N segundos. Con 0 se guardan todos.
carga.detalle.frecuencia.segundos=10

# Contraseña de los usuarios que se crean solos al arrancar (ver DatosIniciales.java).
# En la VM conviene cambiarla con la variable de entorno USUARIOS_PASSWORD.
usuarios.password.inicial=${USUARIOS_PASSWORD:123456}
